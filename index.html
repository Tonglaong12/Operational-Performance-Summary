<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSPM Service Report</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Libre+Baskerville&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#141b29;--mut:#667085;--bd:#d9dee8;--ac:#ef2b2d;--acx:#fff;--ph:#eef1f6;--ok:#1b8a3c;--glow:rgba(239,43,45,.07);--grid:rgba(20,27,41,.04);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131c;--card:#161d2b;--tx:#eef1f6;--mut:#9aa4b5;--bd:#2a3446;--ac:#ef2b2d;--acx:#fff;--ph:#1d2636;--ok:#4cc16f;--glow:rgba(239,43,45,.17);--grid:rgba(255,255,255,.03);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e131c;--card:#161d2b;--tx:#eef1f6;--mut:#9aa4b5;--bd:#2a3446;--ac:#ef2b2d;--acx:#fff;--ph:#1d2636;--ok:#4cc16f;--glow:rgba(239,43,45,.17);--grid:rgba(255,255,255,.03);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse 70% 55% at 12% 18%,var(--glow),transparent 70%),linear-gradient(var(--grid) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/48px 48px,var(--bg);background-attachment:fixed;color:var(--tx);font:16px/1.5 'Sarabun',system-ui,-apple-system,'Noto Sans Thai',sans-serif}
#top{background:var(--card);border-bottom:3px solid var(--ac);padding:10px 14px;display:flex;align-items:center;gap:12px}
#top img{height:52px;background:#fff;border-radius:4px;padding:2px}
#top b{display:block;line-height:1.2}#top small{color:var(--mut)}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 8px}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 3px}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 10px}
textarea{min-height:90px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px}
button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.dg{color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;aspect-ratio:4/3;background:var(--ph);border:1px dashed var(--bd);border-radius:8px;color:var(--mut);font-size:14px;overflow:hidden;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd)}
.item:first-of-type{border-top:0}
.chip{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--bd);color:var(--mut)}.chip.ok{color:var(--ok);border-color:var(--ok)}
.mut{color:var(--mut);font-size:14px}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:4px;background:var(--ac);z-index:60;pointer-events:none}
main,#top{position:relative;z-index:1}
#tg{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:5;display:flex;border-radius:16px;overflow:hidden;border:1px solid var(--ac)}
#tg button{border:0;border-radius:0;padding:3px 10px;background:#fff;color:#000}#tg button.on{background:var(--ac);color:#fff}
.hm{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.hm img{width:min(80vw,360px);height:auto;background:#fff;border-radius:10px;padding:5px}
.hm h1{font:600 clamp(24px,7vw,44px)/1.4 'Sarabun',system-ui,'Noto Sans Thai',sans-serif;letter-spacing:.03em;color:var(--tx);margin:6px 0}
.hm hr{width:min(100%,520px);border:0;border-top:1px solid var(--bd);margin:0}
.seg2{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}.seg2 button{border:0;border-radius:0;padding:8px 20px;background:var(--card)}.seg2 button.on{background:var(--ac);color:var(--acx);font-weight:600}
.prow{display:grid;grid-template-columns:48% 1fr;gap:10px;margin-bottom:12px}.prow .ph{aspect-ratio:auto}.prow .ph img{height:auto;object-fit:contain}.prow textarea{min-height:100px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip2{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:14px;padding:1px 2px 1px 10px;font-size:14px}.chip2 button{border:0;background:none;color:var(--ac);padding:0 8px;font-size:15px}
.pms button.tip{position:relative}
.pms button.tip:hover::after,.pms button.tip:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;background:var(--tx);color:var(--bg);font-size:13px;font-weight:400;padding:5px 10px;border-radius:8px;z-index:20;pointer-events:none}
.pms.many button{min-width:0;padding:12px 14px;font-size:15px}
.pms{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:640px}
.pms button{min-width:112px;padding:20px 22px;border-radius:14px;font-weight:700;font-size:18px}
.pms .add{border-style:dashed;color:var(--mut)}.pms .x{min-width:0;padding:4px 8px;font-size:13px;border-radius:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;display:none;z-index:9}
.doc{background:#fff;color:#000;padding:10px;font-size:13px;overflow-x:auto}
.doc table{width:100%;border-collapse:collapse;margin-bottom:6px}
.doc td{border:1px solid #333;padding:5px 7px;vertical-align:top}
.doc .c{text-align:center}.doc .pw{white-space:pre-wrap;min-height:70px}
.doc img{width:100%;display:block}.doc tr{break-inside:avoid}
@media print{body{background:#fff}.noprint{display:none!important}main{padding:0;max-width:none}.doc{padding:0}}
</style>
</head>

<script>
/* ใช้เมื่อเปิดไฟล์นี้นอก claude.ai: เก็บข้อมูลในเครื่อง (localStorage) แทนฐานข้อมูลกลาง */
if(!window.claude){window.__LOCAL=1;(()=>{
 const ld=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
 const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){throw{code:'quota_exceeded'}}};
 const subs=new Set(),K=p=>'db:'+p,snap=(id,d)=>({id,exists:d!=null,data:()=>d});
 const cols=p=>{const pre='db:'+p+'/',o=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(pre)&&!k.slice(pre.length).includes('/'))o.push(snap(k.slice(pre.length),ld(k)))}return o};
 const fire=()=>subs.forEach(o=>o.run());
 const doc=p=>({set:async d=>{sv(K(p),d);fire()},get:async()=>snap(p.split('/').pop(),ld(K(p))),
  onSnapshot(fn){const o={run:()=>fn(snap(p.split('/').pop(),ld(K(p))))};subs.add(o);setTimeout(o.run,0);return()=>subs.delete(o)}});
 const collection=p=>({onSnapshot(fn){const o={run:()=>fn({docs:cols(p)})};subs.add(o);setTimeout(o.run,0);return()=>subs.delete(o)}});
 const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 const mods={
  user:{me:async()=>({id:'local',name:'',canEdit:false,isOwner:false})},
  db:{doc,collection},
  assets:{upload:b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const id=uid();try{sv('asset:'+id,r.result)}catch(e){return no(e)}ok({id,url:r.result})};r.readAsDataURL(b)})},
  downloads:{save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}}
 };
 window.claude={use:async n=>mods[n]||null};
})()}
</script>

 const lines=(t)=>String(t||'').split('\n').map(l=>para([run(l)]));

 const borders={top:B,bottom:B,left:B,right:B};

 const W=10400; // usable width in DXA (A4 with ~1.5cm margins)
 const tbl=(rows,cols)=>new Table({width:{size:W,type:WidthType.DXA},columnWidths:cols,rows});
 const lab=(l,v)=>para([run(l+' ',true),run(v)]);
 const c3=Math.floor(W/3);
 const head=tbl([new TableRow({children:[
  cell([new Paragraph({alignment:AlignmentType.CENTER,children:[new ImageRun({data:logo.bytes,transformation:{width:130,height:Math.round(130*logo.h/logo.w)}})]})],{width:{size:2400,type:WidthType.DXA},verticalAlign:VerticalAlign.CENTER}),

  cell([para([run('หมายเลขเอกสาร : '+dv('docno','FM-FS-17'))]),para([run('แก้ไขครั้งที่ : '+dv('rev','00'))]),para([run('วันที่บังคับใช้ : '+dv('eff','01/02/67'))])],{width:{size:3000,type:WidthType.DXA}})
 ]})],[2400,5000,3000]);
 const info=tbl([
  new TableRow({children:[cell([lab('ชื่อลูกค้า :',f.customer)],{columnSpan:3,width:{size:W,type:WidthType.DXA}})]}),
  new TableRow({children:[cell([lab('สถานที่ :',f.site)],{columnSpan:3,width:{size:W,type:WidthType.DXA}})]}),

  new TableRow({children:[cell([lab('ประเภทงาน :',f.type)],{width:{size:c3,type:WidthType.DXA}}),cell([para([run('เลขงาน : '+(f.job||''))])],{width:{size:c3,type:WidthType.DXA}}),cell([para([run('วันที่ปฏิบัติงาน : '+thDate(f.date))])],{width:{size:W-2*c3,type:WidthType.DXA}})]})
 ],[c3,c3,W-2*c3]);
 const box=(title,body)=>tbl([new TableRow({children:[cell([para([run(title,true)]),...lines(body),para([run('')])],{width:{size:W,type:WidthType.DXA}})]})],[W]);
 const pw=5200;

 (r.rows||[]).forEach((x,i)=>{

   cell(x.cap?lines(x.cap):[para([run('')])],{width:{size:W-pw,type:WidthType.DXA}})

 });
 const photos=tbl(photoRows,[pw,W-pw]);
 const gap=()=>new Paragraph({spacing:{after:80},children:[]});

const loadJs=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
const grab=(src,type)=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.naturalWidth;c.height=i.naturalHeight;c.getContext('2d').drawImage(i,0,0);c.toBlob(async b=>ok({bytes:new Uint8Array(await b.arrayBuffer()),w:c.width,h:c.height}),type||'image/jpeg',.9)};i.onerror=no;i.src=src});
const fname=ext=>('FM-FS-17_'+(S.cur.f.customer||'report')+'_'+(S.cur.f.date||'')).replace(/[\\/:*?"<>|\s]+/g,'_')+'.'+ext;
async function saveFile(blob,ext){
 const dl=await claude.use('downloads');if(!dl)return toast('มุมมองนี้ดาวน์โหลดไฟล์ไม่ได้');
 try{await dl.save({filename:fname(ext),data:blob})}catch(e){if(!e||e.code!=='declined')toast('บันทึกไฟล์ไม่สำเร็จ ('+(e&&e.code||'error')+')')}}
async function makeWord(){
 await loadJs('https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js');
 const D=window.docx,r=S.cur,logo=await grab(LOGO,'image/png'),imgs=[];
 for(const x of r.rows)imgs.push(await grab(bu(x.id)));
 await saveFile(await D.Packer.toBlob(buildDocx(D,r,imgs,logo)),'docx');

async function makePdf(){
 await Promise.all([loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')]);
 const el=document.createElement('div');el.style.cssText='position:absolute;left:-10000px;top:0;width:794px;background:#fff';
 el.innerHTML=doc(S.cur);document.body.appendChild(el);
 try{
  await Promise.all([...el.querySelectorAll('img')].map(i=>i.complete?1:new Promise(ok=>{i.onload=i.onerror=ok})));
  const base=el.getBoundingClientRect().top;
  const cuts=[...el.querySelectorAll('tr,table')].map(n=>Math.round(n.getBoundingClientRect().top-base));
  const cv=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:'#fff'});
  const H=el.scrollHeight,k=cv.width/794,pageH=Math.floor(277*794/190);
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  let y=0,first=true;
  while(y<H-1){
   let end=Math.min(H,y+pageH);
   if(end<H){const c=cuts.filter(v=>v>y+150&&v<=end);if(c.length)end=Math.max(...c)}
   const sl=document.createElement('canvas');sl.width=cv.width;sl.height=Math.round((end-y)*k);
   sl.getContext('2d').drawImage(cv,0,Math.round(y*k),cv.width,sl.height,0,0,cv.width,sl.height);
   if(!first)pdf.addPage();first=false;
   pdf.addImage(sl.toDataURL('image/jpeg',.9),'JPEG',10,10,190,(end-y)*190/794);
   y=end}
  await saveFile(pdf.output('blob'),'pdf');
 }finally{el.remove()}
}

  if(S.view==='home'){const l=cfg.cats;cfg.cats=sv?(cats().includes(n)?l:[...l,n]):l.filter(x=>x!==n)}
  else{if(S.cat==='F&S'&&cfg.prods.Fire){const t=cfg.prods['F&S']||[];cfg.prods['F&S']=[...t,...cfg.prods.Fire.filter(x=>!t.includes(x))];delete cfg.prods.Fire}const l=cfg.prods[S.cat]||[];cfg.prods[S.cat]=sv?(prods(S.cat).includes(n)?l:[...l,n]):l.filter(x=>x!==n)}
  try{await S.db.doc('config/types').set(cfg);S.cfg=cfg;S.adding=false;S.pmName=''}catch(x){toast('บันทึกไม่สำเร็จ')}}
 else if(a==='edit'){S.view='form'}
 else if(a==='preview'){S.view='preview';window.scrollTo(0,0)}
 else if(a==='delrow'){S.cur.rows.splice(+d.i,1)}
 else if(a==='save'){if(await persist())toast('บันทึกแบบร่างแล้ว');return}
 else if(a==='send'){if(await persist('sent')){toast('ส่งรายงานแล้ว');S.view='list'}}
 else if(a==='pdf'||a==='word'){exportDoc(a);return}
 render();
});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(d.f)S.cur.f[d.f]=t.value;else if(d.k)S.cur[d.k]=t.value;else if(d.cap)S.cur.rows[+d.cap].cap=t.value;else if(t.id==='pn')S.pmName=t.value;else if(d.addv)S.optNew[d.addv]=t.value});
document.addEventListener('change',async e=>{const t=e.target,d=t.dataset;
 if(d.a==='filter'){S.filter=t.value;render()}
 else if(d.opt){S.cur.f[d.opt]=t.value;if(d.opt==='product')render()}
 else if(d.file&&t.files.length){
  if(!S.assets){toast('บัญชีนี้ยังอัปโหลดรูปไม่ได้ (ต้องเป็น Contributor ขึ้นไป)');return}
  toast('กำลังอัปโหลดรูป…');
  for(const f of t.files){try{const r=await S.assets.upload(await shrink(f));S.cur.rows.push({id:r.id,cap:''})}catch(x){toast('อัปโหลดไม่สำเร็จ ('+(x&&x.code||'error')+')')}}
  render()}});
init();
</script>
</body>
